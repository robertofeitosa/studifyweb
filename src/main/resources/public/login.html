<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Entrar • Studify</title>
    <meta name="theme-color" content="#111827">
    <link rel="icon" type="image/x-icon" href="studify.ico?v=2">
    <link rel="apple-touch-icon" href="studify-icon.png?v=2">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-brand">
                <img src="studify-icon.png" alt="Ícone do Studify" width="58" height="58">
                <div>
                    <span class="private-pill">Acesso privado</span>
                    <h1 id="loginTitle">Studify</h1>
                    <p>Seu painel pessoal de estudos.</p>
                </div>
            </div>

            <form id="loginForm" autocomplete="on">
                <label for="username">Usuário</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >

                <label for="password">Senha</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button id="loginButton" type="submit">Entrar no Studify</button>
                <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
            </form>

            <div class="login-footer">
                <span class="status-dot"></span>
                Área pessoal de José Roberto Feitosa de Pádua
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
